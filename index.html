<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ledgerline</title>
    <style>
        :root {
            --bg: #0d1110;
            --pn: #141a18;
            --pn2: #192120;
            --ln: #242d2a;
            --tx: #dde4df;
            --mu: #7b8a84;
            --ac: #d6a24a;
            --up: #6dbd8c;
            --dn: #d8644f;
            --glow: rgba(214, 162, 74, .17);
            --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace
        }

        @media(prefers-color-scheme:light) {
            :root {
                --bg: #f2f0ea;
                --pn: #fbfaf6;
                --pn2: #f0eee6;
                --ln: #dcd8cc;
                --tx: #1c211f;
                --mu: #6c7771;
                --ac: #a86d12;
                --up: #2f7d51;
                --dn: #b8402e;
                --glow: rgba(168, 109, 18, .13)
            }
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            height: 100%
        }

        body {
            background: var(--bg);
            color: var(--tx);
            font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
            overflow-x: hidden
        }

        #app {
            height: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 1
        }

        .n {
            font-family: var(--mono);
            font-variant-numeric: tabular-nums
        }

        .up {
            color: var(--up)
        }

        .dn {
            color: var(--dn)
        }

        .mu {
            color: var(--mu)
        }

        button,
        input,
        select {
            font: inherit;
            color: inherit
        }

        em {
            font-style: normal
        }

        /* ---------- ambient background ---------- */
        .bgfx {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden
        }

        .bgfx i {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            animation: drift 24s ease-in-out infinite alternate
        }

        .bgfx i:nth-child(1) {
            width: 46vw;
            height: 46vw;
            left: -12vw;
            top: -18vw;
            background: radial-gradient(circle, var(--glow), transparent 68%)
        }

        .bgfx i:nth-child(2) {
            width: 40vw;
            height: 40vw;
            right: -10vw;
            bottom: -16vw;
            background: radial-gradient(circle, rgba(109, 189, 140, .14), transparent 68%);
            animation-duration: 30s;
            animation-delay: -9s
        }

        .bgfx::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: linear-gradient(var(--ln) 1px, transparent 1px), linear-gradient(90deg, var(--ln) 1px, transparent 1px);
            background-size: 56px 56px;
            opacity: .3;
            -webkit-mask-image: radial-gradient(ellipse at 50% 25%, #000 5%, transparent 70%);
            mask-image: radial-gradient(ellipse at 50% 25%, #000 5%, transparent 70%);
            animation: gridmove 34s linear infinite
        }

        @keyframes drift {
            to {
                transform: translate(9vw, 6vw) scale(1.18)
            }
        }

        @keyframes gridmove {
            to {
                background-position: 56px 56px, 56px 56px
            }
        }

        /* ---------- motion primitives ---------- */
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(16px)
            }
        }

        @keyframes fadein {
            from {
                opacity: 0
            }
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.94) translateY(10px)
            }
        }

        @keyframes dr {
            from {
                stroke-dashoffset: 1
            }
        }

        @keyframes seg {
            from {
                stroke-dasharray: 0 100
            }
        }

        @keyframes grow {
            from {
                transform: scaleX(0)
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: .55
            }

            100% {
                transform: scale(4.2);
                opacity: 0
            }
        }

        @keyframes orbp {
            0% {
                transform: scale(1);
                opacity: .6
            }

            100% {
                transform: scale(1.7);
                opacity: 0
            }
        }

        @keyframes ping {
            0% {
                box-shadow: 0 0 0 0 #6dbd8caa
            }

            70%,
            100% {
                box-shadow: 0 0 0 9px #6dbd8c00
            }
        }

        @keyframes floaty {

            0%,
            100% {
                transform: translateY(0) rotate(-1deg)
            }

            50% {
                transform: translateY(-20px) rotate(1.5deg)
            }
        }

        @keyframes shake {

            10%,
            90% {
                transform: translateX(-2px)
            }

            20%,
            80% {
                transform: translateX(4px)
            }

            30%,
            50%,
            70% {
                transform: translateX(-7px)
            }

            40%,
            60% {
                transform: translateX(7px)
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes mq {
            to {
                transform: translateX(-50%)
            }
        }

        @keyframes flu {
            0% {
                background: #6dbd8c4d
            }

            100% {
                background: transparent
            }
        }

        @keyframes fld {
            0% {
                background: #d8644f4d
            }

            100% {
                background: transparent
            }
        }

        @keyframes tfu {
            0% {
                box-shadow: 0 0 0 1px var(--up), 0 0 26px #6dbd8c66
            }

            100% {
                box-shadow: 0 0 0 0 transparent
            }
        }

        @keyframes tfd {
            0% {
                box-shadow: 0 0 0 1px var(--dn), 0 0 26px #d8644f66
            }

            100% {
                box-shadow: 0 0 0 0 transparent
            }
        }

        @keyframes sheen {
            to {
                transform: translateX(260%)
            }
        }

        .enter .rise {
            animation: rise .65s cubic-bezier(.2, .7, .2, 1) backwards;
            animation-delay: calc(var(--i, 0)*70ms)
        }

        .enter tbody tr {
            animation: rise .5s cubic-bezier(.2, .7, .2, 1) backwards;
            animation-delay: calc(var(--i, 0)*38ms + 120ms)
        }

        .enter .dr {
            stroke-dasharray: 1;
            stroke-dashoffset: 0;
            animation: dr 1.3s ease backwards
        }

        .enter .area {
            animation: fadein 1.3s .5s backwards
        }

        .enter .seg {
            animation: seg 1.1s cubic-bezier(.3, .7, .2, 1) backwards;
            animation-delay: calc(var(--i, 0)*110ms + 150ms)
        }

        .enter .mb i {
            animation: grow .9s cubic-bezier(.2, .7, .2, 1) backwards;
            animation-delay: calc(var(--i, 0)*45ms + 250ms)
        }

        .fl-up {
            animation: flu 1.2s ease-out
        }

        .fl-dn {
            animation: fld 1.2s ease-out
        }

        .tf-up {
            animation: tfu 1.3s ease-out
        }

        .tf-dn {
            animation: tfd 1.3s ease-out
        }

        /* ---------- controls ---------- */
        input,
        select {
            background: var(--bg);
            border: 1px solid var(--ln);
            border-radius: 6px;
            padding: 10px 12px;
            width: 100%;
            outline: 0;
            transition: border-color .2s, box-shadow .2s
        }

        input:focus,
        select:focus {
            border-color: var(--ac);
            box-shadow: 0 0 0 3px var(--glow)
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--mu);
            margin: 15px 0 6px
        }

        label em {
            letter-spacing: 0;
            text-transform: none;
            font: 11px var(--mono);
            transition: color .2s
        }

        label em.ok {
            color: var(--up)
        }

        .btn {
            position: relative;
            overflow: hidden;
            background: var(--ac);
            color: #15110a;
            border: 0;
            border-radius: 6px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .15s, filter .2s, box-shadow .25s
        }

        .btn::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: -60%;
            width: 40%;
            background: linear-gradient(110deg, transparent, rgba(255, 255, 255, .45), transparent);
            transform: skewX(-20deg);
            pointer-events: none
        }

        .btn:hover {
            filter: brightness(1.08);
            box-shadow: 0 8px 24px -10px var(--ac)
        }

        .btn:hover::after {
            animation: sheen .8s
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn.g {
            background: none;
            color: var(--tx);
            border: 1px solid var(--ln)
        }

        .btn.g:hover {
            border-color: var(--mu);
            box-shadow: none
        }

        .btn.g::after {
            display: none
        }

        .btn.s {
            background: var(--dn);
            color: #fff
        }

        .btn.s:hover {
            box-shadow: 0 8px 24px -10px var(--dn)
        }

        .btn.ld {
            pointer-events: none;
            color: transparent
        }

        .btn.ld::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 16px;
            height: 16px;
            margin: -8px;
            border: 2px solid #15110a55;
            border-top-color: #15110a;
            border-radius: 50%;
            animation: spin .7s linear infinite
        }

        .chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px
        }

        .chip2 {
            background: var(--pn2);
            border: 1px solid var(--ln);
            border-radius: 20px;
            padding: 3px 11px;
            font-size: 12px;
            color: var(--mu);
            cursor: pointer;
            transition: .2s
        }

        .chip2:hover {
            color: var(--tx);
            border-color: var(--ac);
            transform: translateY(-1px)
        }

        .chip2.on {
            color: var(--tx);
            border-color: var(--ac);
            background: var(--glow)
        }

        .sw {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            color: var(--mu);
            user-select: none
        }

        .sw b {
            width: 34px;
            height: 19px;
            border-radius: 20px;
            background: var(--ln);
            position: relative;
            transition: background .25s
        }

        .sw b::after {
            content: "";
            position: absolute;
            left: 3px;
            top: 3px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--tx);
            transition: transform .25s
        }

        .sw.on {
            color: var(--tx)
        }

        .sw.on b {
            background: var(--ac)
        }

        .sw.on b::after {
            transform: translateX(15px);
            background: #15110a
        }

        /* ---------- layout ---------- */
        .shell {
            display: grid;
            grid-template-columns: 224px 1fr;
            height: 100vh
        }

        nav {
            border-right: 1px solid var(--ln);
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: color-mix(in srgb, var(--pn) 60%, transparent);
            backdrop-filter: blur(8px)
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 22px;
            padding: 0 8px 24px;
            letter-spacing: .01em;
            display: flex;
            align-items: center;
            gap: 9px
        }

        .logo i {
            color: var(--ac)
        }

        .mark {
            width: 26px;
            height: 26px
        }

        .mark path {
            stroke: var(--ac);
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1;
            animation: dr 2.4s ease-in-out infinite alternate
        }

        nav a {
            padding: 10px 11px;
            border-radius: 7px;
            cursor: pointer;
            color: var(--mu);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: color .2s, background .2s, transform .2s
        }

        nav a:hover {
            color: var(--tx);
            transform: translateX(3px)
        }

        nav a.on {
            background: linear-gradient(90deg, var(--glow), transparent);
            color: var(--tx);
            box-shadow: inset 2px 0 var(--ac)
        }

        .ic {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: none
        }

        .me {
            margin-top: auto;
            padding: 12px 8px 2px;
            border-top: 1px solid var(--ln);
            display: flex;
            gap: 11px;
            align-items: center;
            font-size: 12px
        }

        .me div {
            display: flex;
            flex-direction: column;
            line-height: 1.3
        }

        .av {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: conic-gradient(from 200deg, var(--ac), var(--up), var(--ac));
            display: grid;
            place-items: center;
            color: #15110a;
            font-weight: 700;
            flex: none
        }

        .col {
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh
        }

        main {
            flex: 1;
            overflow: auto;
            padding: 26px 34px 60px
        }

        .tape {
            display: flex;
            align-items: center;
            height: 40px;
            border-bottom: 1px solid var(--ln);
            background: color-mix(in srgb, var(--pn) 70%, transparent);
            flex: none
        }

        .live {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 15px;
            height: 100%;
            border-right: 1px solid var(--ln);
            font: 600 10px var(--mono);
            letter-spacing: .16em;
            color: var(--up);
            flex: none
        }

        .live i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--up);
            animation: ping 1.8s infinite
        }

        .live.demo {
            color: var(--ac)
        }

        .live.demo i {
            background: var(--ac);
            animation: none
        }

        .track {
            overflow: hidden;
            flex: 1;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 36px, #000 calc(100% - 36px), transparent);
            mask-image: linear-gradient(90deg, transparent, #000 36px, #000 calc(100% - 36px), transparent)
        }

        .mq {
            display: flex;
            width: max-content;
            animation: mq var(--dur, 50s) linear infinite
        }

        .track:hover .mq {
            animation-play-state: paused
        }

        .mq>span {
            display: flex;
            gap: 9px;
            align-items: center;
            padding: 3px 22px;
            white-space: nowrap;
            font-size: 12px;
            border-radius: 4px
        }

        .mq>span b {
            font-weight: 600
        }

        h1 {
            font: 400 28px Georgia, serif;
            margin: 0 0 4px
        }

        h2 {
            font-size: 12px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--mu);
            margin: 0 0 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .sub {
            color: var(--mu);
            margin-bottom: 22px
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap
        }

        .head .acts {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        .grid {
            display: grid;
            gap: 14px
        }

        .g4 {
            grid-template-columns: repeat(4, 1fr)
        }

        .g2 {
            grid-template-columns: 1fr 1fr
        }

        .g3 {
            grid-template-columns: 1.5fr 1fr
        }

        .g5 {
            grid-template-columns: repeat(5, 1fr)
        }

        .card {
            background: var(--pn);
            background: color-mix(in srgb, var(--pn) 88%, transparent);
            border: 1px solid var(--ln);
            border-radius: 10px;
            padding: 20px;
            transition: border-color .25s, transform .25s, box-shadow .25s;
            backdrop-filter: blur(6px)
        }

        .card.hv:hover {
            border-color: var(--mu);
            transform: translateY(-3px);
            box-shadow: 0 18px 40px -24px #000a
        }

        .k {
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--mu)
        }

        .v {
            font-size: 22px;
            margin-top: 6px
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            font-size: 11px;
            letter-spacing: .07em;
            text-transform: uppercase;
            color: var(--mu);
            font-weight: 600;
            text-align: right;
            padding: 8px 10px;
            border-bottom: 1px solid var(--ln);
            white-space: nowrap
        }

        td {
            padding: 11px 10px;
            text-align: right;
            border-bottom: 1px solid var(--ln);
            transition: background .2s
        }

        th:first-child,
        td:first-child {
            text-align: left
        }

        tbody tr:last-child td {
            border: 0
        }

        tbody tr:hover td {
            background: var(--pn2)
        }

        th.so {
            cursor: pointer;
            user-select: none
        }

        th.so:hover {
            color: var(--tx)
        }

        .tag {
            font: 600 10px var(--mono);
            padding: 3px 7px;
            border-radius: 4px;
            letter-spacing: .07em
        }

        .tag.BUY {
            background: #6dbd8c22;
            color: var(--up)
        }

        .tag.SELL {
            background: #d8644f22;
            color: var(--dn)
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0
        }

        .empty {
            padding: 38px 20px;
            text-align: center;
            color: var(--mu)
        }

        .empty .orb {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            margin: 0 auto 14px;
            border: 1.5px solid var(--ac);
            position: relative
        }

        .empty .orb::after {
            content: "";
            position: absolute;
            inset: -1.5px;
            border-radius: 50%;
            border: 1.5px solid var(--ac);
            animation: orbp 2.4s ease-out infinite
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 12px;
            background: var(--pn2)
        }

        /* hero / dashboard */
        .nw {
            position: relative;
            overflow: hidden
        }

        .nw::before {
            content: "";
            position: absolute;
            right: -60px;
            top: -80px;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow), transparent 70%);
            animation: drift 14s ease-in-out infinite alternate
        }

        .nwv {
            font: 400 44px/1.1 Georgia, serif;
            margin: 8px 0 6px;
            letter-spacing: -.01em
        }

        .trio {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--ln)
        }

        .trio .v {
            font-size: 17px
        }

        .dwrap {
            position: relative;
            width: 176px;
            margin: 0 auto 10px
        }

        .donut {
            width: 100%;
            transform: rotate(0deg)
        }

        .dc {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center
        }

        .lgd {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 16px
        }

        .lgd .row {
            padding: 3px 0;
            font-size: 13px
        }

        .mv {
            display: grid;
            grid-template-columns: 48px 1fr 68px;
            align-items: center;
            gap: 10px;
            padding: 5px 0
        }

        .mb {
            position: relative;
            height: 8px;
            background: var(--pn2);
            border-radius: 4px;
            overflow: hidden
        }

        .mb::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--ln)
        }

        .mb i {
            position: absolute;
            top: 0;
            bottom: 0;
            border-radius: 4px
        }

        .act {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 14px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--ln)
        }

        .act:last-child {
            border: 0
        }

        /* market */
        .tiles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
            gap: 12px;
            margin-bottom: 14px
        }

        .tile {
            padding: 14px;
            border: 1px solid var(--ln);
            border-radius: 10px;
            background: var(--pn);
            background: color-mix(in srgb, var(--pn) 88%, transparent);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform .2s, border-color .2s, box-shadow .2s
        }

        .tile:hover {
            transform: translateY(-4px);
            border-color: var(--mu)
        }

        .tile.sel {
            border-color: var(--ac);
            box-shadow: 0 0 0 1px var(--ac), 0 14px 34px -16px var(--ac)
        }

        .tile::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--ac), transparent);
            transform: scaleX(0);
            transition: transform .4s
        }

        .tile.sel::before {
            transform: none
        }

        .tile .th {
            display: flex;
            justify-content: space-between;
            align-items: baseline
        }

        .tile .tp {
            font-size: 17px;
            margin: 8px 0 1px
        }

        .tile .tb {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 6px
        }

        #bigchart {
            position: relative;
            height: 290px
        }

        .tip {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            transition: opacity .15s;

            for (const id in kv) { const e = document.getElementById(id); if (!e) continue; if (e.tagName == 'SELECT' && ![...e.options].some(o => o.value == kv[id])) continue; e.value = kv[id] }
